name: Test strict hostkeys checking with unreachable host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with strict_hostkeys_checking and unreachable host (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: "-avzr"
          remote_path: "/remote/deploy"
          remote_host: "192.0.2.1"
          remote_port: 22
          remote_user: "testuser"
          remote_key: "fake-key"
          strict_hostkeys_checking: "true"

      - name: Assert action failed due to unreachable host
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when strict_hostkeys_checking=true and host is unreachable, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when host key could not be fetched"
