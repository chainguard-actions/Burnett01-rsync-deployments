name: Test strict host key checking with unreachable host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Generate a throwaway SSH key pair for testing
      - name: Generate test SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          echo "TEST_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          switches: "-avz"
          path: ""
          remote_path: /tmp/deploy
          remote_host: 192.0.2.1
          remote_port: 22
          remote_user: testuser
          remote_key: ${{ env.TEST_KEY }}
          strict_hostkeys_checking: "true"
          debug: "false"

      - name: Assert action failed (strict hostkeys + unreachable host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when strict_hostkeys_checking=true and host is unreachable, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with strict host key checking and unreachable host"
