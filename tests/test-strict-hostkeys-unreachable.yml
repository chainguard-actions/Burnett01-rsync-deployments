name: Test strict host keys checking fails for unreachable host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a throwaway client key
        run: |
          rm -f /tmp/unreach_key /tmp/unreach_key.pub
          ssh-keygen -q -t ed25519 -N '' -f /tmp/unreach_key -C test 2>/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq openssh-client >/dev/null || \
            (apt-get update -qq && apt-get install -y -qq openssh-client >/dev/null)
            ssh-keygen -q -t ed25519 -N '' -f /tmp/unreach_key -C test
          }
          {
            echo "UNREACH_KEY<<__KEY_EOF__"
            cat /tmp/unreach_key
            echo "__KEY_EOF__"
          } >> "$GITHUB_ENV"
      - name: Create content to deploy
        run: |
          mkdir -p unreach-src
          echo "x" > unreach-src/x.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          switches: -av
          strict_hostkeys_checking: 'true'
          path: unreach-src/
          remote_path: /tmp/never/
          remote_host: 127.0.0.1
          remote_port: '1'
          remote_user: nobody
          remote_key: ${{ env.UNREACH_KEY }}
      - name: Assert action failed when host key cannot be fetched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when host key is unavailable"; exit 1
          fi
          echo "PASS"
