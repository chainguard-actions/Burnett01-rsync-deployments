name: Test strict host keys checking option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with strict_hostkeys_checking=true against unreachable host
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: '-avzr'
          remote_path: '/tmp/deploy'
          remote_host: '192.0.2.1'
          remote_port: 22
          remote_user: 'testuser'
          remote_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          strict_hostkeys_checking: 'true'

      - name: Assert action failed (strict host key checking with unreachable host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With strict_hostkeys_checking=true the action runs ssh-keyscan.
          # 192.0.2.1 is a TEST-NET address (RFC 5737) that is guaranteed unreachable.
          # ssh-keyscan will return empty, causing the action to exit with a warning.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (cannot fetch host key for unreachable host), but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when strict host key checking cannot fetch key (expected)"
