name: Test deploy to unreachable host fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a throwaway key
        id: key
        run: |
          rm -f /tmp/unreach_key /tmp/unreach_key.pub
          ssh-keygen -t ed25519 -N "" -f /tmp/unreach_key -q
          {
            echo "key<<EOF_KEY"
            cat /tmp/unreach_key
            echo "EOF_KEY"
          } >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          switches: -avz
          rsh: -o ConnectTimeout=5
          path: tests/
          remote_path: /tmp/nowhere/
          remote_host: 127.0.0.1
          remote_port: 2299
          remote_user: nobody
          remote_key: ${{ steps.key.outputs.key }}

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no sshd is listening"
            exit 1
          fi
          echo "PASS"
