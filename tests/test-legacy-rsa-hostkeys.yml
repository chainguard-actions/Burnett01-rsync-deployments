name: Test legacy RSA host keys option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with legacy_allow_rsa_hostkeys enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: '-avzr'
          remote_path: '/tmp/deploy/'
          remote_host: '127.0.0.1'
          remote_port: 22
          remote_user: 'testuser'
          remote_key: 'fake-rsa-key-for-legacy-test'
          legacy_allow_rsa_hostkeys: 'true'
          strict_hostkeys_checking: 'false'

      - name: Assert action failed at SSH stage (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at SSH/rsync stage because there's no real server.
          # This confirms legacy_allow_rsa_hostkeys=true is accepted and processed correctly.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH connection failure expected)"
            exit 1
          fi
          echo "PASS: action accepted legacy_allow_rsa_hostkeys=true and failed at SSH stage as expected"
