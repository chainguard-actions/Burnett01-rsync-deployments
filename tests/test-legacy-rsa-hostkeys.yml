name: Test legacy RSA host keys option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with legacy_allow_rsa_hostkeys=true (expect failure at SSH stage)
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: '-avzr'
          remote_path: '/tmp/deploy'
          remote_host: '127.0.0.1'
          remote_port: 22
          remote_user: 'testuser'
          remote_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          legacy_allow_rsa_hostkeys: 'true'
          strict_hostkeys_checking: 'false'

      - name: Assert action failed at SSH stage (legacy RSA option accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With legacy_allow_rsa_hostkeys=true the action adds RSA host key options to SSH.
          # It should fail at SSH connection (unreachable host), not at input parsing.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH connection refused), but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted legacy_allow_rsa_hostkeys=true and failed at SSH stage (expected)"
