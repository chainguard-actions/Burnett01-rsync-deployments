name: Test blank remote_path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          switches: -avz
          remote_path: '   '
          remote_host: 127.0.0.1
          remote_user: nobody
          remote_key: not-a-real-key
      - name: Assert action failed on blank remote_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for blank remote_path"; exit 1
          fi
          echo "PASS"
