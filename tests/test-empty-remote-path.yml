name: Test empty remote_path validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with empty remote_path (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: '-avzr --delete'
          remote_path: '   '
          remote_host: '127.0.0.1'
          remote_user: 'testuser'
          remote_key: 'fake-key'

      - name: Assert action failed due to empty remote_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty remote_path, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when remote_path is empty/whitespace"
