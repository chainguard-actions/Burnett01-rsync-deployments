name: Test empty remote_path validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with empty remote_path (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: "-avzr --delete"
          remote_path: "   "
          remote_host: "localhost"
          remote_user: "testuser"
          remote_key: "fake-key"

      - name: Assert action failed due to empty remote_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty remote_path, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with empty remote_path"
