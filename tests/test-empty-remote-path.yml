name: Test empty remote_path validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a dummy SSH key for testing
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@example.com"
          {
            echo "TEST_KEY<<EOF"
            cat /tmp/test_key
            echo "EOF"
          } >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          switches: "-avz"
          remote_path: "   "
          remote_host: "localhost"
          remote_user: "testuser"
          remote_key: ${{ env.TEST_KEY }}

      - name: Assert action failed due to empty remote_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when remote_path is whitespace-only"
          else
            echo "FAIL: expected failure for empty remote_path but got '$OUTCOME'"
            exit 1
          fi
