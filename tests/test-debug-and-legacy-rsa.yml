name: Test debug mode and legacy RSA hostkeys option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a dummy RSA SSH key for testing
        run: |
          ssh-keygen -t rsa -b 4096 -f /tmp/test_rsa_key -N "" -C "test@example.com"
          {
            echo "TEST_KEY<<EOF"
            cat /tmp/test_rsa_key
            echo "EOF"
          } >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          switches: "-avz"
          remote_path: "/tmp/deploy/"
          remote_host: "192.0.2.1"
          remote_port: 2222
          remote_user: "deployuser"
          remote_key: ${{ env.TEST_KEY }}
          legacy_allow_rsa_hostkeys: "true"
          strict_hostkeys_checking: "false"
          debug: "true"

      - name: Assert action failed gracefully with debug and legacy RSA options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when host is unreachable (debug + legacy RSA options exercised)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded — no real host should be reachable at 192.0.2.1:2222"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
