name: Test action fails on unreachable host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unreachable host (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: "-avzr --delete"
          remote_path: "/var/www/html/"
          remote_host: "192.0.2.1"
          remote_port: 22
          remote_user: "deploy"
          remote_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          remote_key_pass: ""

      - name: Assert action failed (SSH/rsync connection refused or timeout)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when host is unreachable"
            exit 1
          fi
          echo "PASS: action correctly failed when host is unreachable"
