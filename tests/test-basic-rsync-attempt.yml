name: Test basic rsync attempt with valid key and unreachable host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair and export content
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          # Export key content as a multiline env var
          {
            echo 'TEST_SSH_KEY<<EOF'
            cat /tmp/test_key
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Run action with valid SSH key and unreachable host (expect failure at rsync)
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: "-avzr"
          remote_path: "/remote/deploy"
          remote_host: "192.0.2.1"
          remote_port: 22
          remote_user: "testuser"
          remote_key: ${{ env.TEST_SSH_KEY }}
          strict_hostkeys_checking: "false"
          debug: "false"

      - name: Assert action failed at rsync connection (not at key loading)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to unreachable host, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at rsync connection stage (SSH key was accepted)"
