name: Test basic connection attempt reaches SSH stage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Start a local SSH server so the action can connect
      - name: Start local SSH server
        run: |
          sudo apt-get install -y openssh-server 2>/dev/null || true
          sudo mkdir -p /var/run/sshd
          sudo /usr/sbin/sshd -p 2222 || true
          # Generate a test SSH key pair
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "SSH key generated"

      - name: Run action with unreachable host (expect failure at SSH/rsync stage)
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: '-avzr'
          remote_path: '/tmp/remote-deploy/'
          remote_host: '127.0.0.1'
          remote_port: 2222
          remote_user: 'nobody'
          remote_key: ${{ secrets.GITHUB_TOKEN }}
          strict_hostkeys_checking: 'false'

      - name: Assert action failed at SSH/rsync stage (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because SSH auth fails, not because of missing/invalid inputs.
          # A failure here means the action correctly processed all inputs and reached the rsync stage.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH auth failure expected with fake key)"
            exit 1
          fi
          echo "PASS: action reached SSH/rsync stage and failed as expected (auth failure)"
