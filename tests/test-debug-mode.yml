name: Test debug mode flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with debug enabled (expect failure at SSH stage, not at input validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: '-avzr'
          remote_path: '/tmp/deploy/'
          remote_host: '127.0.0.1'
          remote_port: 22
          remote_user: 'testuser'
          remote_key: 'fake-rsa-key-for-debug-test'
          debug: 'true'
          strict_hostkeys_checking: 'false'

      - name: Assert action failed (expected - no real SSH server, but debug mode was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at SSH/rsync stage (not at input validation or debug flag parsing).
          # This confirms debug=true is accepted and the action proceeds past input validation.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH connection failure expected)"
            exit 1
          fi
          echo "PASS: action accepted debug=true and failed at SSH stage as expected"
