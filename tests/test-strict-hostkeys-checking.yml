name: Test strict host keys checking with unreachable host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with strict_hostkeys_checking=true against unreachable host
        id: action
        uses: .
        continue-on-error: true
        with:
          switches: '-avzr'
          remote_path: '/tmp/deploy/'
          remote_host: '192.0.2.1'
          remote_port: 22
          remote_user: 'testuser'
          remote_key: 'fake-rsa-key-for-strict-test'
          strict_hostkeys_checking: 'true'

      - name: Assert action failed (expected - ssh-keyscan fails for unreachable host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With strict_hostkeys_checking=true, the action runs ssh-keyscan against the host.
          # 192.0.2.1 is a TEST-NET address (RFC 5737) that is guaranteed to be unreachable.
          # ssh-keyscan will fail to fetch the host key, causing the action to exit with error.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (ssh-keyscan should fail for unreachable host)"
            exit 1
          fi
          echo "PASS: action correctly failed when strict host key checking cannot fetch host key"
